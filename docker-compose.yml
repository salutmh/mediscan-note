name: mediscan-note

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload
    ports:
      - "8010:8010"
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-sqlite:////data/mediscan.db}
      MEDISCAN_SECRET_KEY: ${MEDISCAN_SECRET_KEY_DOCKER:-dev-only-change-me}
      MEDISCAN_PUBLIC_BASE: http://localhost:8010
    volumes:
      - ./backend:/app
      - backend_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"
        ]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    working_dir: /app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      MEDICAL_AI_DATA_ROOT: /data/ai
    volumes:
      - ./ai_service:/app
      - "${AI_DATA_ROOT_HOST}:/data/ai:ro"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8010/api
      VITE_MEDICAL_AI_API_BASE: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  backend_data:
  frontend_node_modules:
